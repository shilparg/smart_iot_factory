apiVersion: 1

providers:
  # --- Anomalies dashboard ---
  - name: "anomalies"
    orgId: 1
    folder: "Anomalies"
    type: file
    editable: false
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/anomalies

  # --- System Health dashboards ---
  - name: "system-health"
    orgId: 1
    folder: "System Health"
    type: file
    editable: false
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/system-health

  # --- Latency dashboards ---
  - name: "latency"
    orgId: 1
    folder: "Latency"
    type: file
    editable: false
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/latency

  # --- IoT Sim dashboards ---
  - name: "iot-sim"
    orgId: 1
    folder: "IoT Sim"
    type: file
    editable: false
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/iot-sim

  # --- Executive Overview dashboard ---
  - name: "executive-overview"
    orgId: 1
    folder: "Executive Overview"
    type: file
    editable: false
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/provisioning/dashboards/executive-overview
