# notification-policies.yaml
---
apiVersion: 1

policies:
  - orgId: 1
    receiver: email-notifier
    groupBy: ["alertname"]
    route:
      receiver: email-notifier
      routes:
        - receiver: email-notifier
          object_matchers:
            - ["severity", "=", "warning"]

        - receiver: email-notifier
          object_matchers:
            - ["severity", "=", "critical"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
    continue: false
