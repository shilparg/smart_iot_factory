apiVersion: 1
groups:
  - name: anomaly-alerts
    folder: "Anomaly Alerts"
    interval: 30s
    rules:
      - uid: anomaly-ratio-high
        title: "High Anomaly Ratio"
        condition: "A > 20"
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: (rate(anomaly_type_total[5m]) / rate(events_total[5m])) * 100
              format: time_series
              instant: false
              intervalMs: 15000
              relativeTimeRange:
                from: 5m
                to: 0s
        for: 2m
        annotations:
          summary: "Anomaly ratio exceeded 20%"
        labels:
          severity: warning
        notifications:
          - uid: email-notifier

      - uid: spike-severity-critical
        title: "Critical Temperature Spike"
        condition: "A > 25"
        data:
          - refId: A
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, rate(temperature_spike_c_bucket[5m]))
              format: time_series
              instant: false
              intervalMs: 15000
              relativeTimeRange:
                from: 5m
                to: 0s
        for: 1m
        annotations:
          summary: "95th percentile spike > 25°C"
        labels:
          severity: critical
        notifications:
          - uid: email-notifier
