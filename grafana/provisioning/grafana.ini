[server]
http_port = 3000
domain = localhost
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
admin_user = admin
admin_password = admin

[auth.anonymous]
enabled = false

[smtp]
enabled = true
host = smtp.example.com:587
user = your_smtp_user
password = your_smtp_password
skip_verify = true
from_address = alerts@example.com
from_name = IoT Simulator Alerts
startTLS_policy = OpportunisticStartTLS

[alerting]
enabled = true

[unified_alerting]
enabled = true