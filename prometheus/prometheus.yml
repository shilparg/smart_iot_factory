global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "iot-simulator"
    static_configs:
      - targets: ["iot-simulator:9200"] # host port mapping

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9101"] # host port mapping

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"] # Prometheus itself
